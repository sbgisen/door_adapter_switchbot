[project]
name = "door_adapter_switchbot"
version = "0.1.0"
description = "The door_adapter_switchbot package"
license = { text = "Apache-2.0" }
maintainers = [
    { name = "SoftBank corp.", email = "SBGRP-git@g.softbank.co.jp" },
]
dependencies = [
    "numpy<2",
    "python-switchbot>=2.3.1",
    "pyyaml>=6.0.2",
]

[project.scripts]
door_adapter_switchbot = "door_adapter_switchbot.door_adapter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["door_adapter_switchbot"]
